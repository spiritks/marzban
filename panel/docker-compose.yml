services:
  marzban:
    image: gozargah/marzban:latest
    container_name: marzban
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./data/marzban:/var/lib/marzban

  login-bridge:
    image: python:3.13-alpine
    container_name: marzban-login-bridge
    restart: unless-stopped
    network_mode: host
    env_file: .env
    depends_on:
      - marzban
    volumes:
      - ./marzban-login-bridge.py:/app/marzban-login-bridge.py:ro
    command: ["python", "/app/marzban-login-bridge.py"]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    container_name: marzban-oauth2-proxy
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command:
      - --http-address=127.0.0.1:4180
      - --reverse-proxy=true
      - --upstream=static://202
      - --provider=oidc
      - --oidc-issuer-url=${OAUTH2_PROXY_OIDC_ISSUER_URL}
      - --client-id=${OAUTH2_PROXY_CLIENT_ID}
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET}
      - --redirect-url=${OAUTH2_PROXY_REDIRECT_URL}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --email-domain=${OAUTH2_PROXY_EMAIL_DOMAINS}
      - --whitelist-domain=${PANEL_DOMAIN}
      - --scope=${OAUTH2_PROXY_SCOPE}
      - --set-xauthrequest=true
      - --pass-access-token=true
      - --pass-authorization-header=true
      - --skip-provider-button=true

  caddy:
    image: caddy:2-alpine
    container_name: marzban-caddy
    restart: unless-stopped
    network_mode: host
    depends_on:
      - marzban
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      PANEL_HTTPS_PORT: ${PANEL_HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
